{% extends "base.html" %}

{% block title %}Login - Bela Moda{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="mb-4">Entrar</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        Entrar
                    </button>
                </form>

                <p class="mt-3">
                    Não tem uma conta?
                    <a href="{% url 'accounts:register' %}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
